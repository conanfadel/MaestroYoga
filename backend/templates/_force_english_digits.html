<script>
  (function forceEnglishDigits() {
    var map = {
      "\u0660": "0", "\u0661": "1", "\u0662": "2", "\u0663": "3", "\u0664": "4",
      "\u0665": "5", "\u0666": "6", "\u0667": "7", "\u0668": "8", "\u0669": "9",
      "\u06F0": "0", "\u06F1": "1", "\u06F2": "2", "\u06F3": "3", "\u06F4": "4",
      "\u06F5": "5", "\u06F6": "6", "\u06F7": "7", "\u06F8": "8", "\u06F9": "9"
    };
    function normalizeDigits(text) {
      return String(text || "").replace(/[\u0660-\u0669\u06F0-\u06F9]/g, function (ch) {
        return map[ch] || ch;
      });
    }
    function normalizeNumberLikeText(text) {
      var s = normalizeDigits(text);
      s = s.replace(/[\u066B]/g, "."); // Arabic decimal separator
      s = s.replace(/[\u066C]/g, ""); // Arabic thousands separator
      s = s.replace(/,/g, "."); // tolerate comma decimals
      return s;
    }
    function allowsDecimalForInput(input) {
      if (!input) return false;
      if (input.dataset && input.dataset.numericAllowDecimal != null) {
        return input.dataset.numericAllowDecimal === "1";
      }
      var im = (input.getAttribute("inputmode") || "").toLowerCase();
      if (im === "decimal") return true;
      var step = (input.getAttribute("step") || "").trim().toLowerCase();
      if (!step) return false;
      return step === "any" || step.indexOf(".") >= 0;
    }
    function sanitizeNumericValue(text, allowDecimal) {
      var s = normalizeNumberLikeText(text);
      var out = "";
      var dotSeen = false;
      var fracCount = 0;
      for (var i = 0; i < s.length; i += 1) {
        var ch = s.charAt(i);
        if (ch >= "0" && ch <= "9") {
          if (allowDecimal && dotSeen) {
            if (fracCount >= 2) continue;
            fracCount += 1;
          }
          out += ch;
          continue;
        }
        if (allowDecimal && ch === "." && !dotSeen) {
          out += ".";
          dotSeen = true;
        }
      }
      if (allowDecimal && out.indexOf(".") === 0) out = "0" + out;
      return out;
    }
    function formatTwoDecimalString(text) {
      var clean = sanitizeNumericValue(text, true);
      if (!clean || clean === ".") return "";
      var n = parseFloat(clean);
      if (!Number.isFinite(n)) return "";
      return n.toFixed(2);
    }
    var EASTERN_DIGIT_RE = /[\u0660-\u0669\u06F0-\u06F9]/;
    var ENABLE_TEXT_NORMALIZATION = /^\/admin(?:\/|$)/.test(window.location.pathname || "");
    var ENABLE_STRONG_NUMERIC_INPUT_FIX = ENABLE_TEXT_NORMALIZATION;
    var NUMERIC_INPUT_SELECTOR = [
      'input[type="number"]',
      'input[type="tel"]',
      'input[type="date"]',
      'input[type="time"]',
      'input[type="datetime-local"]',
      'input[type="week"]',
      'input[type="month"]',
      'input[type="range"]',
      'input[inputmode="numeric"]',
      'input[inputmode="decimal"]',
      'input[inputmode="tel"]'
    ].join(",");
    function stampNumericInputLang(root) {
      if (!root) return;
      var nt = root.nodeType;
      if (nt !== 1 && nt !== 11) return;
      try {
        if (nt === 1 && root.matches && root.matches(NUMERIC_INPUT_SELECTOR)) {
          root.setAttribute("lang", "en");
          root.setAttribute("dir", "ltr");
        }
        if (root.querySelectorAll) {
          var nodes = root.querySelectorAll(NUMERIC_INPUT_SELECTOR);
          for (var i = 0; i < nodes.length; i += 1) {
            nodes[i].setAttribute("lang", "en");
            nodes[i].setAttribute("dir", "ltr");
          }
        }
      } catch (e) {}
    }
    /** فقط حقول الإدخال — تجنّب اجتياز كل نصوص DOM (صفحة الإدارة ضخمة وتجمّد الواجهة). */
    function normalizeInputsUnder(root) {
      if (!root) return;
      var nt = root.nodeType;
      if (nt !== 1 && nt !== 11) return;
      var list;
      try {
        if (nt === 1 && (root.matches("input") || root.matches("textarea"))) {
          list = [root];
        } else {
          list = root.querySelectorAll ? root.querySelectorAll("input, textarea") : [];
        }
      } catch (e2) {
        return;
      }
      for (var i = 0; i < list.length; i += 1) {
        var node = list[i];
        var tag = (node.tagName || "").toLowerCase();
        if (tag === "input" || tag === "textarea") {
          var strictNumeric = isStrictNumericInput(node);
          var numericish = isNumericishInput(node);
          if (typeof node.value === "string") {
            if (strictNumeric) {
              node.value = allowsDecimalForInput(node)
                ? formatTwoDecimalString(node.value)
                : sanitizeNumericValue(node.value, false);
            } else if (numericish) {
              node.value = normalizeNumberLikeText(node.value);
            } else {
              node.value = normalizeDigits(node.value);
            }
          }
          if (typeof node.placeholder === "string") {
            node.placeholder = normalizeDigits(node.placeholder);
          }
          if (node.hasAttribute("value")) {
            node.setAttribute(
              "value",
              strictNumeric
                ? (
                  allowsDecimalForInput(node)
                    ? formatTwoDecimalString(node.getAttribute("value"))
                    : sanitizeNumericValue(node.getAttribute("value"), false)
                )
                : numericish
                  ? normalizeNumberLikeText(node.getAttribute("value"))
                  : normalizeDigits(node.getAttribute("value"))
            );
          }
        }
      }
    }
    function forceEnglishNumberField(input) {
      if (!ENABLE_STRONG_NUMERIC_INPUT_FIX) return;
      if (!input || (input.tagName || "").toLowerCase() !== "input") return;
      if ((input.type || "").toLowerCase() !== "number") return;
      if (input.dataset.numericTextForced === "1") return;
      if (input.hasAttribute("data-keep-native-digits")) return;

      var step = (input.getAttribute("step") || "").trim();
      var integerLikeStep = !step || step === "1";
      var allowDecimal = !integerLikeStep || step.toLowerCase() === "any";

      input.setAttribute("lang", "en");
      input.setAttribute("dir", "ltr");
      input.setAttribute("inputmode", integerLikeStep ? "numeric" : "decimal");
      input.style.fontFamily = 'Arial, "Segoe UI", Tahoma, sans-serif';
      input.style.unicodeBidi = "isolate";
      input.style.direction = "ltr";

      // Chromium may still localize glyphs for type=number in Arabic locale;
      // forcing text input keeps Latin digits visually stable.
      try {
        input.type = "text";
      } catch (e0) {}
      if ((input.type || "").toLowerCase() !== "text") return;

      if (!input.getAttribute("pattern")) {
        input.setAttribute("pattern", integerLikeStep ? "[0-9]*" : "[0-9]*([.][0-9]*)?");
      }
      input.dataset.numericAllowDecimal = allowDecimal ? "1" : "0";
      input.dataset.numericTextForced = "1";
      input.value = allowDecimal
        ? formatTwoDecimalString(input.value || "")
        : sanitizeNumericValue(input.value || "", false);
      if (input.hasAttribute("value")) {
        input.setAttribute(
          "value",
          allowDecimal
            ? formatTwoDecimalString(input.getAttribute("value"))
            : sanitizeNumericValue(input.getAttribute("value"), false)
        );
      }
    }
    function forceEnglishNumberFieldsUnder(root) {
      if (!ENABLE_STRONG_NUMERIC_INPUT_FIX || !root) return;
      var nt = root.nodeType;
      if (nt !== 1 && nt !== 11) return;
      try {
        if (nt === 1 && root.matches && root.matches('input[type="number"]')) {
          forceEnglishNumberField(root);
        }
        if (root.querySelectorAll) {
          var nums = root.querySelectorAll('input[type="number"]');
          for (var i = 0; i < nums.length; i += 1) forceEnglishNumberField(nums[i]);
        }
      } catch (e1) {}
    }
    function shouldSkipTextParent(parent) {
      if (!parent || !parent.tagName) return true;
      var tag = String(parent.tagName).toUpperCase();
      if (
        tag === "SCRIPT" ||
        tag === "STYLE" ||
        tag === "NOSCRIPT" ||
        tag === "TEXTAREA" ||
        tag === "INPUT" ||
        tag === "OPTION" ||
        tag === "SELECT"
      ) {
        return true;
      }
      if (parent.closest && parent.closest("[data-keep-native-digits], .no-digit-normalize")) return true;
      return false;
    }
    function normalizeTextNodesUnder(root) {
      if (!ENABLE_TEXT_NORMALIZATION) return;
      if (!root || !document.createTreeWalker || !window.NodeFilter) return;
      var nt = root.nodeType;
      if (nt !== 1 && nt !== 9 && nt !== 11) return;
      var nodes = [];
      var walker = document.createTreeWalker(
        root,
        NodeFilter.SHOW_TEXT,
        {
          acceptNode: function (node) {
            if (!node || !node.nodeValue || !EASTERN_DIGIT_RE.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
            if (shouldSkipTextParent(node.parentElement)) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          },
        }
      );
      var current;
      while ((current = walker.nextNode())) nodes.push(current);
      for (var i = 0; i < nodes.length; i += 1) {
        var n = nodes[i];
        var normalized = normalizeDigits(n.nodeValue);
        if (normalized !== n.nodeValue) n.nodeValue = normalized;
      }
    }
    function isNumericishInput(el) {
      if (!el || (el.tagName || "").toLowerCase() !== "input") return false;
      if (el.dataset && el.dataset.numericTextForced === "1") return true;
      var t = (el.type || "").toLowerCase();
      if (t === "number" || t === "tel" || t === "date" || t === "time" || t === "datetime-local" || t === "week" || t === "month" || t === "range") {
        return true;
      }
      var im = (el.getAttribute("inputmode") || "").toLowerCase();
      return im === "numeric" || im === "decimal" || im === "tel";
    }
    function isStrictNumericInput(el) {
      if (!el || (el.tagName || "").toLowerCase() !== "input") return false;
      if (el.dataset && el.dataset.numericTextForced === "1") return true;
      var t = (el.type || "").toLowerCase();
      if (t === "number" || t === "tel" || t === "range") return true;
      var im = (el.getAttribute("inputmode") || "").toLowerCase();
      return im === "numeric" || im === "decimal" || im === "tel";
    }
    function applyUnder(root) {
      forceEnglishNumberFieldsUnder(root);
      normalizeInputsUnder(root);
      stampNumericInputLang(root);
      normalizeTextNodesUnder(root);
    }
    function applyAll() {
      if (!document.body) return;
      applyUnder(document.body);
    }
    applyAll();

    document.addEventListener(
      "input",
      function (ev) {
        var el = ev.target;
        if (!isNumericishInput(el)) return;
        var nv = isStrictNumericInput(el)
          ? sanitizeNumericValue(el.value, allowsDecimalForInput(el))
          : normalizeNumberLikeText(el.value);
        if (nv === el.value) return;
        el.value = nv;
      },
      true
    );
    document.addEventListener(
      "blur",
      function (ev) {
        var el = ev.target;
        if (!isNumericishInput(el)) return;
        var nv = isStrictNumericInput(el)
          ? (
            allowsDecimalForInput(el)
              ? formatTwoDecimalString(el.value)
              : sanitizeNumericValue(el.value, false)
          )
          : normalizeNumberLikeText(el.value);
        if (nv !== el.value) el.value = nv;
      },
      true
    );

    if (window.MutationObserver && document.body) {
      var t = 0;
      var obs = new MutationObserver(function (mutations) {
        var pending = [];
        for (var i = 0; i < mutations.length; i += 1) {
          var m = mutations[i];
          if (m.addedNodes && m.addedNodes.length) {
            for (var j = 0; j < m.addedNodes.length; j += 1) {
              var added = m.addedNodes[j];
              if (added && (added.nodeType === 1 || added.nodeType === 11)) pending.push(added);
            }
          }
        }
        if (!pending.length) return;
        if (t) clearTimeout(t);
        t = setTimeout(function () {
          t = 0;
          for (var k = 0; k < pending.length; k += 1) applyUnder(pending[k]);
        }, 50);
      });
      obs.observe(document.body, { childList: true, subtree: true });
    }
  })();
</script>
